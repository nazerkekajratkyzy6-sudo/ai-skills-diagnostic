<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ұстаз Промпт — мұғалімге арналған промпт құрастырғыш, ЖИ кітапханасы және ғылыми жоба бөлімі.">
<meta name="theme-color" content="#0B7F8A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Ұстаз Промпт</title>
<meta name="author" content="Назерке Қайратқызы">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Rubik:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --ink:#16232B; --muted:#56676D;
  --line:#D3DCD8; --accent:#0B7A83; --accent-ink:#FFFFFF; --accent-soft:#D6EDEE;
  --gold:#A8700A; --gold-soft:#F6E8C6; --danger:#B3412E; --danger-soft:#F6DDD7;
  --radius:12px;
  --display:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1517; --surface:#152024; --surface-2:#1B2A2F; --ink:#E3ECEC; --muted:#93A6A9;
    --line:#293C41; --accent:#4CC3CB; --accent-ink:#05272A; --accent-soft:#133C40;
    --gold:#E8B64A; --gold-soft:#3A2E12; --danger:#E6846E; --danger-soft:#3D1D17;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1517; --surface:#152024; --surface-2:#1B2A2F; --ink:#E3ECEC; --muted:#93A6A9;
  --line:#293C41; --accent:#4CC3CB; --accent-ink:#05272A; --accent-soft:#133C40;
  --gold:#E8B64A; --gold-soft:#3A2E12; --danger:#E6846E; --danger-soft:#3D1D17;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px}
.brand-name{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.2px}
.brand-name small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{white-space:nowrap}
.nav button{background:none;border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.nav button:hover{color:var(--ink);border-color:var(--line)}
.nav button.on{background:var(--surface);color:var(--ink);border-color:var(--line)}

/* home */
.hero{padding-block:28px 22px}
.hero h1{font-size:clamp(28px,4.6vw,44px);font-weight:700;letter-spacing:-.6px}
.hero p{color:var(--muted);max-width:62ch;margin:10px 0 0}
.search{position:relative;margin-top:22px;max-width:720px}
.search input{width:100%;padding:15px 18px 15px 46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{margin-top:8px;max-width:720px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.results button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 16px;cursor:pointer}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results .r-path{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.results .empty{padding:14px 16px;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;max-width:760px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14px}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;font-size:12.5px;color:var(--muted);align-items:center}
.flow span{padding:3px 9px;border-radius:6px;background:var(--surface-2);font-weight:500}
.flow span.hl{background:var(--gold-soft);color:var(--gold)}
.flow i{font-style:normal;opacity:.6}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:20px;font-weight:600}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.cat:hover{border-color:var(--accent);transform:translateY(-2px)}
.cat-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cat h3{font-size:16.5px;font-weight:600}
.cat .kz{font-size:12.5px;color:var(--accent);font-weight:500}
.cat .n{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.cat .ex{font-size:13px;color:var(--muted);line-height:1.45}
.cat.special{background:var(--gold-soft);border-color:transparent}
.cat.special .kz{color:var(--gold)}

.own{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.own button{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer}
.own button:hover{border-color:var(--accent)}
.own b{display:block;font-weight:600;font-size:14.5px}
.own span{font-size:12.5px;color:var(--muted)}

/* category view */
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);padding-top:8px}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.cat-head{margin:10px 0 18px}
.cat-head h1{font-size:clamp(24px,3.6vw,34px);font-weight:700}
.cat-head p{color:var(--muted);margin:6px 0 0}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.group h2{font-size:16px;font-weight:600;margin-bottom:10px}
.items{display:flex;flex-wrap:wrap;gap:8px}
.items button{background:var(--surface-2);border:1px solid transparent;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;text-align:left}
.items button:hover{border-color:var(--accent);background:var(--accent-soft)}
.items button .tag{font-size:11px;font-weight:600;color:var(--gold);margin-left:6px;text-transform:uppercase;letter-spacing:.04em}

/* generator */
.gen{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start;padding-bottom:60px}
@media (max-width:900px){.gen{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.gen-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.gen-title h1{font-size:24px;font-weight:700}
.gen-title .by{font-size:12.5px;color:var(--muted);margin-top:4px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--accent)}
.fgroup{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.fgroup>.gl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.fgroup>.gl em{font-style:normal;font-family:var(--mono);color:var(--gold);letter-spacing:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.wide{grid-column:1/-1}
.f>label,.f>.lab{font-size:13.5px;font-weight:600}
.f .req{color:var(--danger);margin-left:3px}
.f .hint{font-size:12.5px;color:var(--muted);margin-top:-2px}
.f input[type=text],.f input[type=number],.f select,.f textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;font-size:14.5px}
.f textarea{min-height:78px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--danger)}
.f.err .chips{outline:1.5px solid var(--danger);outline-offset:4px;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;line-height:1.35}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.lang[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.custom-in{margin-top:6px}
.num{display:flex;align-items:center;gap:6px}
.num button{width:34px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.num input{width:74px!important;text-align:center;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.mode{display:flex;flex-wrap:wrap;gap:6px}
.gen-go{margin-top:18px;width:100%;padding:14px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer}
.gen-go:hover{filter:brightness(1.07)}
.errmsg{margin-top:10px;background:var(--danger-soft);color:var(--danger);border-radius:9px;padding:9px 12px;font-size:13.5px}

.out{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.out{position:static}}
.out-empty{color:var(--muted);font-size:14px}
.out-empty ol{padding-left:20px;margin:10px 0 0}
.out-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.out-h h2{font-size:18px;font-weight:600}
.btn{border:0;border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:600;font-size:13.5px;background:var(--ink);color:var(--bg)}
.btn.ok{background:var(--accent);color:var(--accent-ink)}
.stale{font-size:12.5px;color:var(--gold);background:var(--gold-soft);padding:6px 10px;border-radius:8px;margin-bottom:10px}
.warn{font-size:12.5px;color:var(--danger);margin-bottom:8px}
.prompt{background:var(--surface-2);border-radius:10px;padding:14px;max-height:430px;overflow:auto}
.prompt pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.6px;line-height:1.6}
.meta{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.guide{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.guide h2{font-size:18px;font-weight:600;margin-bottom:12px}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px;font-family:var(--mono)}
.steps b{display:block;font-size:14px}
.steps div{font-size:13.8px;color:var(--ink)}
.steps div p{margin:2px 0}
.steps ul{margin:3px 0 0;padding-left:18px}
.svc{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.svc a{font-size:12.5px;font-weight:600;text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:3px 10px}
.svc a.pri{background:var(--accent);color:var(--accent-ink)}
.note{margin-top:12px;font-size:13px;background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:10px 12px}

/* bonus */
.bonus{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding-bottom:50px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.bcard .no{font-family:var(--mono);font-size:12px;color:var(--gold)}
.bcard h3{font-size:16px;font-weight:600}
.bcard a{margin-top:auto;align-self:flex-start;text-decoration:none;font-weight:600;font-size:13.5px;border:1.5px solid var(--accent);border-radius:999px;padding:6px 13px}
.bcard a:hover{background:var(--accent);color:var(--accent-ink)}
.foot{color:var(--muted);font-size:12.5px;padding-block:10px 8px;text-align:center}
.copy{color:var(--muted);font-size:12.5px;line-height:1.5;text-align:center;border-top:1px solid var(--line,#e5e5e5);padding:14px 8px 40px;margin:0 auto;max-width:720px}.copy b{color:var(--ink,inherit)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.libbanner{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin-top:22px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:14px 16px;cursor:pointer}
.libbanner b{font-family:var(--display);font-size:17px;color:var(--accent)}
.libbanner span{color:var(--ink);font-size:14px}
.ltabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:thin}
.ltabs button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;color:var(--muted);font-weight:500}
.ltabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lwrap{padding-bottom:50px}
.lmodes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media (max-width:620px){.lmodes{grid-template-columns:1fr}}
.lmodes button{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.lmodes button:hover{border-color:var(--accent)}
.lmodes b{font-family:var(--display);font-size:17px}
.lmodes span{color:var(--muted);font-size:13.5px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px}
.lcard.dim{opacity:.72}
.lcard p{margin:0;font-size:13.8px;color:var(--ink);flex:1}
.lcard-h,.lsvc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lsvc-h h1{font-size:clamp(24px,4vw,32px);font-weight:700;margin:10px 0 6px}
.lname{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--display);font-weight:600;font-size:16.5px;color:var(--ink)}
.lname:hover{color:var(--accent)}
.lfav{background:none;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--gold);flex:0 0 auto}
.lfav[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}
.lmeta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted);align-items:center}
.lmeta>span{background:var(--surface-2);border-radius:6px;padding:2px 8px}
.lstat{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.lstat i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lwarn{background:var(--danger-soft)!important;color:var(--danger)}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchips span,.lchips button{font-size:12.5px;background:var(--surface-2);border:1px solid transparent;border-radius:999px;padding:3px 10px;color:var(--ink)}
.lchips button{cursor:pointer;border-color:var(--line);background:var(--surface)}
.lchips button:hover{border-color:var(--accent);color:var(--accent)}
.ldet span{background:var(--gold-soft);color:var(--ink);font-size:13.5px}
.lcard-f{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.lprice{font-size:12.5px;color:var(--muted)}
.lmore{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px;padding:0}
.lprow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:9px;border-bottom:1px solid var(--line)}
.lprow:last-child{border-bottom:0}
.lsub{font-size:12.5px;color:var(--muted);margin-top:2px}
.lempty{color:var(--muted);font-size:14px}
.lfoot{margin-top:28px;color:var(--muted);font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:inherit;text-decoration:underline}
.lfilters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:14px}
.lsel{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);flex:1 1 150px;min-width:0}
.lsel.wide{flex:2 1 240px}
.lsel select,.lsel input{border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:14px;width:100%;color:var(--ink)}
.lquad{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}
.lquad>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.lquad b{font-family:var(--display);font-size:14.5px}
.lquad p{margin:6px 0 0;font-size:14px}
.lbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbtns a.btn{text-decoration:none;display:inline-block}
.lsec{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.lsec h2{font-size:16.5px;font-weight:600;margin-bottom:10px}
.ldl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px;margin:0;font-size:14px}
.ldl dt{color:var(--muted)}
.ldl dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.ldl{grid-template-columns:1fr}.ldl dd{margin-bottom:6px}}
.lidea{background:var(--gold-soft);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.lidea p{margin:0}
.lcode{width:100%;min-height:160px;font-family:var(--mono);font-size:12px;border:1.5px solid var(--line);border-radius:9px;padding:10px;background:var(--bg);color:var(--ink);margin-block:8px}
.lmsg{color:var(--accent);font-weight:600}
.llog{margin:0;padding-left:18px;font-size:13px;max-height:260px;overflow:auto}
.lcheck{display:inline-flex;gap:5px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg)}
.lpre{white-space:pre-wrap;font-family:var(--mono);font-size:12.3px;background:var(--surface-2);border-radius:9px;padding:10px;max-height:220px;overflow:auto;margin:8px 0}
.lmine{margin-bottom:10px}
.ltags{margin-top:14px}

  (pre||'').split(';').filter(Boolean).forEach(p=>{const [k,v]=p.split('=');preset[k]=v});

  ITEMS.push({key:name,n,g:g||s.g,preset,cat:c,sec:s.t,kw:(ALIAS[n]||'')});
})));

function langRule(lang,scope){
  if(!lang) return '[выберите язык материала]';
  if(lang==='Без надписей') return 'На изображении не должно быть никакого текста, букв и цифр.';
  const kzOrth=' Соблюдай казахскую орфографию и используй буквы ә, ғ, қ, ң, ө, ұ, ү, һ, і.';
  if(lang.includes('+')){
    const [a,b]=lang.split(' + ').map(s=>s.trim());
    let s='Материал двуязычный — это прямой выбор учителя: каждый элемент (заголовок, задание, подпись, ответ) сначала на '+LN[a]+', затем на '+LN[b]+'. Оба варианта полные и точные, по смыслу совпадают.';
    if(scope==='image') s='Все надписи двуязычные: сначала на '+LN[a]+', под ними — на '+LN[b]+'. Текста минимум, крупно, без ошибок.';
    if(a==='Қазақша'||b==='Қазақша') s+=kzOrth;
    return s;
  }
  const L=LN[lang];
  let s;
  if(scope==='image') s='Все надписи на изображении — только на '+L+'. Текста минимум, крупно, без орфографических ошибок и искажённых букв. Не добавляй надписей на других языках.';
  else if(scope==='html') s='Весь интерфейс (кнопки, подсказки, сообщения, экраны результата) и всё учебное содержание — полностью на '+L+'. Не смешивай языки. Комментарии в коде можно писать на любом языке.';
  else if(scope==='audio') s='Весь текст для озвучивания и все реплики — полностью на '+L+'. Не смешивай языки.';
  else if(scope==='kmzh') s='Весь ҚМЖ, включая названия строк и колонок таблицы, — полностью на '+L+'. Не смешивай языки.';
  else s='Весь материал — полностью на '+L+': заголовки, задания, инструкции, пояснения, ответы. Не смешивай языки и не вставляй слова на других языках (кроме общепринятых обозначений).';
  if(lang==='Қазақша') s+=kzOrth;
  return s;
}

function norm(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/[«»"]/g,'')}
function renderResults(qs){
  const box=document.getElementById('res');
  const q=norm(qs.trim());
  if(!q){box.innerHTML='';return}
  const words=q.split(/\s+/);
  const scored=ITEMS.map(it=>{
    const nk=KK[it.n]||'';
    const names=norm(it.n+' '+nk);
    const hay=names+' '+norm(it.kw)+' '+norm(it.sec+' '+(KK[it.sec]||''))+' '+norm(it.cat.n+' '+it.cat.kz);
    if(!words.every(w=>hay.includes(w))) return null;
    let sc=0; if(norm(tr(it.n)).startsWith(q)) sc+=10; if(names.includes(q)) sc+=5; if(norm(it.kw).includes(q)) sc+=4;
    return [sc,it];
  }).filter(Boolean).sort((a,b)=>b[0]-a[0]).slice(0,8);
  box.innerHTML='<div class="results">'+(scored.length?scored.map(([,it])=>'<button data-item="'+esc(it.key)+'"><span>'+esc(tr(it.n))+'</span><span class="r-path">'+esc(tr(it.cat.n)+' · '+tr(it.sec))+'</span></button>').join(''):'<div class="empty">'+t('empty')+'</div>')+'</div>';
}

  }else if(f.t==='check'){
    return '<div class="f'+(f.wide?' wide':'')+'" data-f="'+f.k+'"><label class="check"><input type="checkbox" id="'+id+'" data-k="'+f.k+'"'+(v?' checked':'')+'> '+esc(tr(f.l))+'</label></div>';
  }else if(grp){
    const multi=f.t==='multi';
    const vals=multi?(v||[]):[v];
    const known=f.o;
    const customVal=multi?(vals.find(x=>!known.includes(x))||''):(v&&!known.includes(v)?v:'');
    const customOn=f.c&&(customVal!==''||S.v['__c_'+f.k]);
    body='<div class="chips" role="group" aria-label="'+esc(tr(f.l))+'">'+known.map(o=>'<button type="button" class="chip '+(f.cls||'')+'" data-k="'+f.k+'" data-o="'+esc(o)+'" aria-pressed="'+(vals.includes(o))+'">'+esc(tr(o))+'</button>').join('')+
      (f.c?'<button type="button" class="chip" data-k="'+f.k+'" data-custom="1" aria-pressed="'+(!!customOn)+'">'+t('custom')+'</button>':'')+'</div>'+
      (f.c&&customOn?'<input type="text" class="custom-in" id="'+id+'_c" data-k="'+f.k+'" data-customin="1" value="'+esc(customVal)+'" placeholder="'+esc(t('customPh'))+'">':'');
  }
  return '<div class="f'+(f.wide||f.t==='area'?' wide':'')+'" data-f="'+f.k+'">'+lab+hint+body+'</div>';
}
function visible(f){
  if(!f.when) return true;
  const [k,cond]=f.when; const val=S.v[k];
  if(cond.startsWith('!')) return val!==cond.slice(1);
  return val===cond;
}

function buildPrompt(){
  const it=S.item, g=G[it.g], v=S.v;
  const fields=g.fields.map(fieldDef).filter(visible);
  const missing=fields.filter(f=>f.req&&!val(f.k)).map(f=>f.l);
  const P=k=>{const f=fields.find(x=>x.k===k);return val(k)||('[укажите: '+(f?f.l.toLowerCase():k)+']')};
  if(g.id==='kmzh') return {text:buildKmzh(P),missing};
  const L=[];
  L.push('РОЛЬ: '+g.role);
  L.push('');
  L.push('ЗАДАЧА: '+taskLine(it,g,P));
  const ml=modeLines(it); if(ml.length){L.push('');ml.forEach(x=>L.push(x))}
  // параметры
  const skip=['lang','notes','content','tasks','facts','texts','words','scene','equip','settings','chars','params','objectives','kmzhTemplate','stickerText'];
  const plines=fields.filter(f=>!skip.includes(f.k)&&f.t!=='area').map(f=>{
    let s=val(f.k); if(!s) return null;
    if(f.t==='check') s='да';
    return '- '+f.l+': '+s;
  }).filter(Boolean);
  if(plines.length){L.push('');L.push('ПАРАМЕТРЫ:');plines.forEach(x=>L.push(x))}
  // содержательные блоки
  const blocks=fields.filter(f=>f.t==='area'&&!['notes'].includes(f.k)&&val(f.k));
  blocks.forEach(f=>{L.push('');L.push(f.l.toUpperCase()+':');L.push(val(f.k))});
  if(g.id==='assess'&&!val('objectives')){L.push('');L.push('ЦЕЛИ ОБУЧЕНИЯ:');L.push('[укажите цели обучения из учебной программы]')}
  if(g.id==='teacherdoc'&&!val('facts')){L.push('');L.push('ДАННЫЕ УЧИТЕЛЯ:');L.push('[вставьте свои данные]')}
  // язык
  const scope={image:'image',print:'image',photo:'image',html:'html',camera:'html',audio:'audio',song:'audio'}[g.out]||(g.out==='worksheet'&&val('wsResult').startsWith('Изображение')?'image':'text');
  L.push('');L.push('ЯЗЫК МАТЕРИАЛА: '+langRule(val('lang'),scope));
  // требования
  const R=rules(it,g,P);
  if(HINT[it.n]) R.unshift(HINT[it.n]);
  L.push('');L.push('ТРЕБОВАНИЯ:');R.forEach((r,i)=>L.push((i+1)+'. '+r));
  const O=outFormat(it,g,P);
  if(O){L.push('');L.push('ФОРМАТ ОТВЕТА:');L.push(O)}
  if(val('notes')){L.push('');L.push('ДОПОЛНИТЕЛЬНО ОТ УЧИТЕЛЯ:');L.push(val('notes'))}
  if(!['image','print','photo'].includes(g.out)&&!(g.out==='worksheet'&&val('wsResult').startsWith('Изображение'))){
    L.push('');L.push('Не задавай уточняющих вопросов: если каких-то данных не хватает, сделай разумное допущение и перечисли допущения одной строкой в самом конце.');
  }
  return {text:L.join('\n'),missing};
}
function ctx(P){ const parts=[]; if(val('subject'))parts.push('предмет «'+val('subject')+'»'); if(val('grade'))parts.push(val('grade')); if(val('topic'))parts.push('тема «'+val('topic')+'»'); return parts.join(', '); }
function taskLine(it,g,P){
  const c=ctx(P);
  const m={
    image:'Создай изображение: «'+it.n+'».',
    print:'Создай макет для печати: «'+it.n+'».',
    photo:'На основе моей фотографии (прикреплена) создай: «'+it.n+'».',
    html:'Создай полностью рабочий интерактив «'+it.n+'» в ОДНОМ HTML-файле.',
    camera:'Создай полностью рабочий интерактивный урок-игру «'+it.n+'» с бесконтактным управлением через веб-камеру в ОДНОМ HTML-файле.',
    song:'Напиши текст песни и описание музыкального стиля: «'+it.n+'».',

function modeLines(it){
  const m=S.mode, src=val('__src')||'материал', st=val('__srcText');
  const L=[];
  if(m==='scratch') return L;
  if(m==='source') L.push('РЕЖИМ: создание по источнику ('+src+'). Опирайся только на содержание источника: не добавляй факты, даты, числа и определения, которых в нём нет. Если для задания не хватает данных — пометь [нужно уточнить].');
  if(m==='refine') L.push('РЕЖИМ: доработка готового материала ('+src+'). Улучши: '+(val('__refine')||'точность, язык и структуру')+'. Сохрани замысел автора и учебную цель. В конце кратко перечисли, что изменено.');
  if(m==='adapt') L.push('РЕЖИМ: адаптация готового материала ('+src+') для: '+(val('__adapt')||'[укажите для кого]')+'. Сохрани учебную цель и ключевое содержание, измени сложность, объём, формулировки и опоры.');
  if(m==='transform') L.push('РЕЖИМ: преобразование. Преврати приложенный '+src.toLowerCase()+' в «'+it.n+'». Используй только его содержание.');
  if(m==='variants') L.push('РЕЖИМ: создай '+(val('__varN')||2)+' равноценных варианта(ов) — одинаковые по сложности и структуре, разные по содержанию заданий.');
  if(st){L.push('');L.push('ИСТОЧНИК:');L.push('"""');L.push(st);L.push('"""')}
  else if(m!=='variants') L.push('Источник прикреплён к этому сообщению.');
  return L;
}

function kmzhHeaders(lang){

function svcLine(){

function quizFormat(){

  }
  if(p.startsWith('Google')) return 'Выведи вопросы нумерованным списком: вопрос, варианты a–d, строка «Ответ: …», строка «Пояснение: …» — для переноса в Google Формы (режим теста).';

}

function copyPrompt(btn){
  const txt=document.getElementById('promptText').textContent;
  const done=()=>{btn.textContent=t('copied');setTimeout(()=>btn.textContent=t('copy'),1800)};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('promptText'));const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent=t('selected')};
  try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
}

  if(S.generated) S.stale=true;
  const g=G[S.item.g];
  g.fields.map(fieldDef).forEach(f=>{ if(f.share&&S.v[f.k]!==undefined&&S.v[f.k]!==''){PROFILE[f.k]=S.v[f.k]} });
  saveProfile();

  else if(S.generated){ const st=document.querySelector('.stale'); if(!st){const o=document.querySelector('.out-h'); if(o) o.insertAdjacentHTML('afterend','<div class="stale">'+t('stale')+'</div>')} }

function defOf(k){
  if(k==='__varN') return {k,t:'num',min:2,max:10};
  if(k==='__refine') return {k,t:'multi',o:REFINE_O};
  if(k==='__adapt') return {k,t:'chips',o:ADAPT_O,c:1};
  if(k.startsWith('__')) return {k,t:'text'};
  return G[S.item.g].fields.map(fieldDef).find(f=>f.k===k);
}
app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.la){ libAction(b); return; }
  if(b.dataset.home) return go('home');
  if(b.dataset.bonus) return go('bonus');
  if(b.dataset.cat) return go('cat',{cat:CATS.find(c=>c.id===b.dataset.cat)});
  if(b.dataset.item!==undefined) return openItem(b.dataset.item);
  if(b.dataset.mode){S.mode=b.dataset.mode;if(S.mode==='variants'&&!S.v.__varN)S.v.__varN=2;if(!S.v.__src)S.v.__src=S.mode==='source'?SRC[0]:'Готовый материал';markChanged(true);return}
  if(b.dataset.step){
    const k=b.dataset.k,f=defOf(k);const n=Math.min(f.max||99,Math.max(f.min||1,(+S.v[k]||0)+(+b.dataset.step)));
    S.v[k]=n;document.getElementById('f_'+k).value=n;markChanged(false);return;
  }
  if(b.classList.contains('chip')&&b.dataset.k){
    const k=b.dataset.k,f=defOf(k);const multi=f.t==='multi';
    if(b.dataset.custom){
      const on=b.getAttribute('aria-pressed')!=='true';
      S.v['__c_'+k]=on;
      if(!on){ if(multi) S.v[k]=(S.v[k]||[]).filter(x=>f.o.includes(x)); else if(!f.o.includes(S.v[k])) S.v[k]=f.def||''; }
      else if(!multi) S.v[k]='';
      markChanged(true);
      const ci=document.getElementById('f_'+k+'_c'); if(ci) ci.focus();
      return;
    }
    const o=b.dataset.o;
    if(multi){const a=S.v[k]||[];S.v[k]=a.includes(o)?a.filter(x=>x!==o):a.concat(o)}
    else {S.v[k]=o;S.v['__c_'+k]=false}
    const needsRerender=!multi&&(G[S.item.g].fields.map(fieldDef).some(x=>x.when&&x.when[0]===k)||f.c);
    if(needsRerender){markChanged(true);return}
    b.parentElement.querySelectorAll('.chip[data-o]').forEach(c=>c.setAttribute('aria-pressed',multi?(S.v[k].includes(c.dataset.o)):(c.dataset.o===S.v[k])));
    const fe=b.closest('.f'); if(fe) fe.classList.remove('err');
    markChanged(false);return;
  }
  if(b.id==='goBtn'){
    if(!val('lang')){
      document.getElementById('err').innerHTML='<div class="errmsg">'+t('needLang')+'</div>';
      const fl=document.querySelector('[data-f="lang"]'); if(fl){fl.classList.add('err');fl.scrollIntoView({behavior:'smooth',block:'center'})}

}

const _rules3=rules;
rules=function(it,g,P){
  if(g.id==='exitticket'){const R=[];
    if(val('grade')) R.push('Формулировки понятны возрасту: '+val('grade')+'.');

    if(val('etExtras')) R.push('Добавь: '+val('etExtras')+'.');
    R.push('Формат: '+val('wsFormat')+(val('wsFormat').startsWith('1/4')?' — 4 одинаковых билета на листе A4 с линиями разреза':'')+'.');
    if(!val('wsResult').startsWith('Текст')) R.push(styleLine());
    R.push('Результаты билета — для учителя: не переводи их в оценку и не делай рейтинг учеников.');
    return R;}
  const R=_rules3(it,g,P);
  if(g.id==='notebook'&&val('nbType')===CUBEW){
    const s=parseInt(val('cubeSize'))||6;
    for(let i=R.length-1;i>=0;i--){ if(/^Для каждого блока|^Шаблон: сплошная/.test(R[i])) R.splice(i,1); else R[i]=R[i].replace(/ Блоков \/ клапанов: \d+\./,''); }
    R.push('Шаблон: сплошная линия — разрезать (✂), пунктир — сгибать, серое поле «клей» — приклеить.');
    R.push('Standing Cube: все 6 граней — одинаковые квадраты '+s+'×'+s+' см; развёртка «крест» или «Т», клапаны для клея 0,8–1 см чередуются по краям, чтобы куб держал форму и стоял на столе.');
    R.push(4*s+2>27.7?'Развёртка длиной '+(4*s)+' см не помещается на лист A4 одним куском: раздели её на 2 листа с метками стыковки или используй A3.':'Развёртка ('+(4*s)+'×'+(3*s)+' см) помещается на один лист A4 — проверь это в шаблоне.');
    R.push('Содержание граней: '+FACES.map(([k,ru])=>ru.toLowerCase()+' — '+val(k).toLowerCase()).join('; ')+'. На каждой грани сверху — заголовок, ниже — место для записи или рисунка ученика; текст 10–12 пт, заголовок 14–16 пт.');
    R.push('Внизу листа — подсказка «Вырежи → Согни → Склей → Поставь!» на языке материала.');
  }
  if(g.id==='taskcards'){
    const q=val('tcQ');
    if(/прищепк/.test(q)) R.push('Clip card: 3–4 варианта ответа по краю карточки, ученик цепляет прищепку на верный.');
    if(/Scoot/.test(q)) R.push('Станции / Scoot: крупные номера карточек, удобно разложить по классу; ученики переходят по сигналу.');
    if(val('tcPages')) R.push('В том же стиле подготовь: '+val('tcPages').toLowerCase()+'.');
    if(val('tcColor')) R.push('Цвета: '+val('tcColor')+'.');
  }
  return R;
};

const _rules5=rules;
rules=function(it,g,P){
  const common=R=>{if(val('grade'))R.push('Уровень сложности, лексика и примеры соответствуют возрасту: '+val('grade')+'.');R.push('Содержание научно корректно; проверь каждое определение, дату и ответ.')};
  const img=()=>val('wsResult').startsWith('Изображение');
  let R;
  if(g.id==='frayer'){R=[];common(R);
    R.push('Модель Фрейера для понятия «'+(val('topic')||'[понятие]')+'»: понятие крупно в центре, вокруг ячейки — '+DESC[val('frType')]+'.');
    R.push('Не-примеры — действительно НЕ относятся к понятию, но похожи на него (типичная путаница учеников); к каждому — пол-строки «почему нет».');
    R.push('Примеры — конкретные, знакомые ученикам, по возможности из жизни Казахстана.');
    R.push({'Пустая (ученики заполняют)':'Выдай пустой шаблон с подсказками-вопросами в ячейках.','Заполненная (образец для учителя)':'Выдай заполненную модель.'}[val('frFill')]||'Выдай две версии: пустой шаблон с подсказками для учеников и заполненный образец для учителя.');
    if(+S.v.count>1) R.push('Понятий: '+S.v.count+' — по одной модели на понятие, все в едином оформлении.');
    if(img()) R.push(styleLine());
    R.push('Формат: '+val('wsFormat')+'.');
    return R;}
  if(g.id==='timeline'){R=[];common(R);
    R.push('Лента времени «'+(val('topic')||'[тема]')+'»'+(val('trange')?', период '+val('trange'):'')+'; событий: '+val('count')+'. Строго по хронологии, от раннего к позднему.');
    R.push(val('tlEvents')?'Используй события и даты из раздела «СОБЫТИЯ (ЕСЛИ ЕСТЬ СВОИ)»; не меняй даты. Если дата вызывает сомнение — отметь её «[проверить]».':'Выбери ключевые события и поворотные моменты. Только достоверные даты; если не уверен в точной дате — пиши «около …» и отметь «[проверить]». Не придумывай события.');
    R.push('Расположение: '+val('tlLayout')+'.'+(val('tlExtras')?' Добавь: '+val('tlExtras').toLowerCase()+'.':''));
    const o=val('wsResult');
    if(o.startsWith('HTML')) R.push('Один HTML-файл без сервера, базы данных и API-ключей; крупные элементы для интерактивной панели; управление мышью, касанием и клавиатурой; выдай код полностью, без сокращений.');
    if(img()){R.push(styleLine());R.push('Подписи дат и событий — короткие; ИИ-картинки искажают числа, поэтому даты на картинке сверяй с таблицей.')}
    return R;}
  if(g.id==='scoot'){R=[];common(R);
    R.push('Активность: '+withDesc([val('scType')])[0]+'. Станций: '+val('count')+'; на станцию — '+val('scMin')+' мин; общее время ≈ '+(+S.v.count*+S.v.scMin)+' мин — если это больше урока, предложи, как разделить на 2 урока или сократить.');
    R.push('Все задания примерно одинаковы по времени выполнения, чтобы класс переходил по сигналу одновременно; ответы однозначные и помещаются в клетку листа.');
    if(val('content')) R.push('Используй задания учителя из раздела «СОДЕРЖАНИЕ / СВОИ ЗАДАНИЯ» без изменения смысла.');
    if(val('scExtras')) R.push('Подготовь: '+val('scExtras').toLowerCase()+'.');
    if(/Инструкция/.test(val('scExtras'))) R.push('Инструкция учителю: как разложить карточки, правило перехода («Scoot!» — сигнал), что делать ученику, который закончил раньше, как провести обсуждение в конце.');
    if(/Цифровые/.test(val('scType'))) R.push('Для цифровой версии — Google Slides или PowerPoint (Jamboard закрыт с 31.12.2024).');
    if(img()) R.push(styleLine());
    R.push('Размер карточек: '+val('wsFormat')+'.');
    return R;}
  if(g.id==='anchor'){R=[];common(R);
    R.push('Опорный плакат: '+withDesc([val('acType')])[0]+'. Тема: «'+(val('topic')||'[тема]')+'». Блоков: '+val('acBlocks')+'.');
    R.push('Минимум текста: заголовок и короткие фразы по 3–8 слов, крупно; структура понятна за 5 секунд; всё читается с последней парты.');
    if(val('content')) R.push('Используй содержание учителя из раздела «СОДЕРЖАНИЕ / СВОИ ЗАДАНИЯ».');
    if(val('acExtras')) R.push('Добавь: '+val('acExtras').toLowerCase()+'.');
    R.push(styleLine());
    R.push('Формат: '+val('wsFormat')+'.');
    return R;}
  R=_rules5(it,g,P);
  if(g.id==='poster'&&val('pBlocks')) R.push('Информационных блоков: '+val('pBlocks')+'.');
  if(g.id==='poster'&&DESC[val('pStyle')]) R.push('Стиль '+val('pStyle')+': '+DESC[val('pStyle')]+'.');
  return R;
};

S_({id:'arbook',name:'AR Book: уроки и упражнения (Flexreality)',url:'https://arbook.info/',cat:'xr',type:'app',status:'check',verify:'part',price:'freelimited',caps:['ar','3d','test','app'],tasks:['ar','vlab','visualization','test'],subjects:['math','phys','chem','bio','geo'],ages:['g56','g79','g1011'],use:['ind','lesson','extra'],lang:{ru:'check',kk:'no',note:{ru:'В Google Play указаны украинский и английский; русское название встречается в App Store, наличие русского интерфейса проверьте. Казахского нет.',kk:'Google Play-де украин және ағылшын тілдері көрсетілген; App Store-да орысша атауы бар, орыс интерфейсінің бар-жоғын тексеріңіз. Қазақ тілі жоқ.'}},reg:{need:'check',via:{ru:'Уточните в приложении.',kk:'Қосымшадан нақтылаңыз.'}},note:{ru:'Название «Arbook» неоднозначно (есть и другие AR-книги, например AR.Просвещение). Здесь — приложение AR Book компании Flexreality (support@arbook.info). Бесплатно со встроенными покупками; сайт открыть не удалось, требуется проверка.',kk:'«Arbook» атауы бірмәнді емес (басқа AR-кітаптар да бар, мысалы AR.Просвещение). Мұнда — Flexreality компаниясының AR Book қосымшасы (support@arbook.info). Тегін, ішкі сатып алулары бар; сайтты ашу мүмкін болмады, тексеру қажет.'},src:['https://play.google.com/store/apps/details?id=com.flexreality1.arbook&hl=en_US','https://apps.apple.com/us/app/ar-book-lessons-and-exercises/id1351354161'],
 d:{ru:{what:'Мобильное приложение с AR-опытами и 3D-моделями по алгебре, геометрии, физике, химии, биологии, географии и тестами.',why:'Самостоятельное повторение темы с наглядной 3D-моделью.',get:'AR-эксперимент и короткий тест.',try:'Найдите в приложении опыт по теме «[ТЕМА]» и попросите учеников записать 2 наблюдения.',tryGet:'Короткое наблюдение с записью в тетради.'},kk:{what:'Алгебра, геометрия, физика, химия, биология, география бойынша AR-тәжірибелер, 3D-модельдер және тесттер бар мобильді қосымша.',why:'Тақырыпты көрнекі 3D-модельмен өз бетінше қайталау.',get:'AR-тәжірибе және қысқа тест.',try:'Қосымшадан «[ТАҚЫРЫП]» бойынша тәжірибені тауып, оқушыларға 2 бақылау жазуды тапсырыңыз.',tryGet:'Дәптерге жазылатын қысқа бақылау.'}},tags:['AR-учебник','мобильное приложение']}),

 d:{ru:{what:'Бесплатные AR/3D-активности по математике, естествознанию и обществознанию по схеме «наблюдай — исследуй — оцени».',why:'Готовый короткий AR-эпизод для урока без подготовки материалов.',get:'Интерактивная 3D-активность с вопросами.',try:'Выберите активность, близкую к теме «[ТЕМА]», и переведите для учеников 3 ключевых вопроса.',tryGet:'10-минутная AR-активность с обсуждением.'},kk:{what:'«Бақыла — зертте — бағала» үлгісі бойынша математика, жаратылыстану және қоғамтанудан тегін AR/3D белсенділіктер.',why:'Материал дайындамай-ақ сабаққа арналған дайын қысқа AR-эпизод.',get:'Сұрақтары бар интерактивті 3D-белсенділік.',try:'«[ТАҚЫРЫП]» тақырыбына жақын белсенділікті таңдап, оқушыларға 3 негізгі сұрақты аударып беріңіз.',tryGet:'Талқылауы бар 10 минуттық AR-белсенділік.'}},tags:['AR','бесплатно','английский']}),

/* ---- поиск по естественному языку ---- */
const ORD=[['перв',1],['втор',2],['трет',3],['четв',4],['пят',5],['шест',6],['седьм',7],['восьм',8],['девят',9],['десят',10],['одиннадц',11]];
function parseQuery(q){
  const n=norm(q), out={grade:null,subjects:[],tasks:[],words:[]};
  let m=n.match(/(\d{1,2})\s*(-?\s*(сынып|класс|кл|ші|шы|інші|ыншы|нші|нчи|grade))/)||n.match(/(сынып|класс)\s*(\d{1,2})/);
  if(m){const g=+(m[1].match(/\d/)?m[1]:m[2]);if(g>=1&&g<=11)out.grade=g}
  if(!out.grade){for(const [st,g] of ORD){if(new RegExp(st+'[а-я]*(класс|классник)').test(n)){out.grade=g;break}}}
  allSubjects().forEach(s=>{const keys=(s.kw||'').split(/\s+/).filter(Boolean).concat([norm(s.ru),norm(s.kk)]);if(keys.some(k=>k.length>2&&n.includes(norm(k))))out.subjects.push(s.id)});
  const toks=n.split(/[^a-zа-яәғқңөұүһі0-9]+/i).filter(Boolean);
  const hasW=w=>w.length<=3?toks.some(x=>x===w||(w.length===3&&x.startsWith(w))):n.includes(w);
  Object.keys(TASKS).forEach(id=>{const t=TASKS[id];const phrases=(t.kw||'').split(/\s+/).filter(Boolean).map(p=>p.split('+'));
    const hitPhrase=[norm(t.ru),norm(t.kk)].some(x=>x.length>3&&n.includes(x));
    if(hitPhrase||phrases.some(ws=>ws.every(hasW)))out.tasks.push(id)});
  if(/объясн|түсіндір/.test(n)&&!out.tasks.includes('explain'))out.tasks.push('explain');
  const STOP=['мне','нужно','нужен','нужна','нужны','хочу','сделать','создать','сделай','подготовить','для','как','через','керек','маған','жасау','жасағым','келеді','үшін','арқылы','және','или','the','ученикам','оқушыларға','класс','сынып','классе'];
  out.words=toks.filter(w=>w.length>2&&!STOP.includes(w)&&!/^\d+$/.test(w));
  return out;
}
function gradeAge(g){if(!g)return null;if(g<=4)return 'g14';if(g<=6)return 'g56';if(g<=9)return 'g79';return 'g1011'}
function scoreService(s,pq){
  let sc=0; const hay=norm([s.name,s.d.ru.what,s.d.kk.what,s.d.ru.why,s.d.kk.why,(s.tags||[]).join(' '),svcCats(s).map(c=>{const x=LIB_CATS.find(k=>k.id===c);return x?x.ru+' '+x.kk:''}).join(' ')].join(' '));
  pq.tasks.forEach(t=>{if((s.tasks||[]).includes(t))sc+=5});
  pq.words.forEach(w=>{if(hay.includes(w))sc+=1});
  const age=gradeAge(pq.grade); if(age&&(s.ages||[]).includes(age))sc+=1;
  if(pq.subjects.length&&(s.subjects.includes('all')||pq.subjects.some(x=>s.subjects.includes(x))))sc+=1;
  if(!svcRecommend(s))sc-=4;
  return sc;
}

function filterSvcs(){
  const f=S.lib.f, q=norm(S.lib.q||'');
  return allServices().filter(s=>{
    if(f.cat&&!svcCats(s).includes(f.cat))return false;
    if(f.task&&!(s.tasks||[]).includes(f.task))return false;
    if(f.subject&&!(s.subjects.includes('all')||s.subjects.includes(f.subject)))return false;
    if(f.age&&!(s.ages||[]).includes(f.age))return false;
    if(f.lang==='ru'&&s.lang.ru!=='yes')return false;
    if(f.lang==='kk'&&s.lang.kk!=='yes')return false;
    if(f.price==='free'&&!['free','freemium','freelimited'].includes(s.price))return false;
    if(f.price==='paid'&&!['paid','mostlypaid','trial'].includes(s.price))return false;
    if(f.status&&s.status!==f.status)return false;
    if(q){const hay=norm([s.name,s.d.ru.what,s.d.kk.what,s.d.ru.why,s.d.kk.why,(s.tags||[]).join(' '),(s.tasks||[]).map(t=>TASKS[t]?TASKS[t].ru+' '+TASKS[t].kk+' '+TASKS[t].kw:'').join(' '),svcCats(s).join(' ')].join(' '));
      if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}
    return true;
  });
}

function copyText(txt,btn,okLabel){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent=okLabel||L('Скопировано ✓','Көшірілді ✓');setTimeout(()=>btn.textContent=o,1600)}};
  try{navigator.clipboard.writeText(txt).then(done,()=>{if(btn)btn.textContent=L('Выделите и скопируйте вручную','Қолмен белгілеп көшіріңіз')})}catch(e){if(btn)btn.textContent=L('Выделите и скопируйте вручную','Қолмен белгілеп көшіріңіз')}
}
function svcSummary(s){const d=s.d[UI]||s.d.ru;return s.name+(s.url?' — '+s.url:'')+'\n'+d.what+'\n'+L('Зачем: ','Не үшін: ')+d.why+'\n'+L('Статус: ','Мәртебе: ')+lt(LIB_STATUS[s.status])+'; '+lt(LIB_PRICE[s.price])+' ('+L('проверено ','тексерілді ')+s.checked+')'}

function libInput(el){
  if(el.dataset.lf){S.lib.f[el.dataset.lf]=el.value;const y=window.scrollY;renderLib();window.scrollTo({top:y});return true}
  if(el.id==='libListQ'){S.lib.q=el.value;clearTimeout(libInput.t);libInput.t=setTimeout(()=>{const pos=el.selectionStart;renderLib();const n=document.getElementById('libListQ');if(n){n.focus();n.setSelectionRange(pos,pos)}},250);return true}
  if(el.id==='libPQ'){S.lib.pq=el.value;clearTimeout(libInput.t);libInput.t=setTimeout(()=>{const pos=el.selectionStart;renderLib();const n=document.getElementById('libPQ');if(n){n.focus();n.setSelectionRange(pos,pos)}},250);return true}

}

  line('Планируемый продукт','product');
  L2.push('- Апробация: '+({done:'проведена — описывать только по фактическим материалам ниже',planned:'только запланирована — описывать строго как план',none:'не проводилась — не придумывать участников и показатели; допустимо указать, что эффективность продукта пока не проверялась'}[RS.d.approb]||'['+RS_NEED+']'));
  if(full){
    [['Уже сделано','done'],['Имеющиеся первичные материалы','have'],['Ещё предстоит получить','toGet'],['Проблема','problem'],['Актуальность','relevance'],['Исследовательский вопрос','question'],['Цель','goal'],['Объект','object'],['Предмет исследования','subj']].forEach(([a,k])=>line(a,k));

    line('Задачи','tasksR');line('Методы','',rarr('methods').map(x=>rsName(RS_METHODS,x)).join(', '));
    [['Измеряемые показатели','indicators'],['Ожидаемый результат (прогноз, не результат)','expected'],['Новизна','novelty'],['Ограничения','limits']].forEach(([a,k])=>line(a,k));
  }
  return L2;
}
function rsReg(){
  const L2=['ТРЕБОВАНИЯ КОНКУРСА'+(RS.d.regOk?' (сверены пользователем с документом текущего учебного года):':' (НЕ подтверждены — перед применением сверить с действующим положением):')];
  const any=['regYear','regGrades','regSections','limit','regFormat','regParts','regEssay','regDiary','regReview','regRefs','regDefense'].some(k=>rv(k));
  if(!any){L2.push('- Требования не введены. Не применяй правила других конкурсов и прошлых лет автоматически; где нужно требование — пометка «уточнить по положению».');return L2}
  [['Документ (год, организатор)','regYear'],['Допустимые классы','regGrades'],['Направления и секции','regSections'],['Предельный объём основного текста, стр.','limit'],['Шрифт, интервал, поля, нумерация','regFormat'],['Обязательные части','regParts'],['Эссе и аннотация','regEssay'],['Дневник','regDiary'],['Пікір и рецензия','regReview'],['Ссылки и литература','regRefs'],['Защита','regDefense']].forEach(([a,k])=>{if(rv(k))L2.push('- '+a+': '+rv(k))});
  if(rarr('excl').length) L2.push('- Не входят в лимит основного текста: '+rarr('excl').map(x=>rsName(RS_EXCL,x)).join(', ')+'. Страницы основного текста считай отдельно от этих документов.');
  if(rv('regConflict')) L2.push('- Замеченные расхождения: '+rv('regConflict'));
  return L2;
}

    const P=rsProblems();
    body='<section class="panel"><h2 style="font-size:18px;margin-bottom:10px">'+L('Обнаруженные проблемы','Табылған мәселелер')+' ('+P.filter(p=>!p.info).length+')</h2>'+
      P.map(p=>'<div class="rsprob'+(p.info?' info':'')+'"><b>'+esc(p.where)+': '+esc(p.what)+'</b>'+esc(p.fix)+' <button class="linkbtn" data-rs="step" data-i="'+p.step+'">'+L('Исправить','Түзету')+'</button></div>').join('')+'</section>'+
      '<section class="panel" style="margin-top:14px"><h2 style="font-size:18px;margin-bottom:6px">'+L('Промпты по этапам','Кезең бойынша промпттар')+'</h2><p class="lsub" style="margin-bottom:10px">'+L('В каждый промпт уже подставлены ваши сведения, требования конкурса и правила достоверности.','Әр промптқа сіздің мәліметтеріңіз, байқау талаптары және шынайылық ережелері қойылған.')+'</p>'+
      RS_STAGE_NAMES.map((n,i)=>{if(!n)return '';const ts=RS_TASKS.filter(t=>t.st===i);return ts.length?'<div class="gl" style="font-size:12px;font-weight:600;color:var(--muted);margin:8px 0 6px">'+i+'. '+esc(L(n[0],n[1]))+'</div><div class="rstask">'+ts.map(t=>'<button class="'+(RS.task===t.id?'btn ok':'ghost')+'" data-rs="task" data-id="'+t.id+'">'+esc(L(t.ru,t.kk))+(rsMissing(t).length?' ⚠':'')+'</button>').join('')+'</div>':''}).join('')+
      '<div class="lbtns" style="margin-top:10px"><button class="btn" data-rs="task" data-id="unified">'+L('Единый промпт (всё сразу, по шагам)','Бірыңғай промпт (барлығы, қадаммен)')+'</button></div></section>'+
      (RS.task?rsOut():'')+
      '<section class="panel lsec" style="margin-top:14px"><h2>'+L('Черновик','Жоба')+'</h2><p class="lsub">'+L('Черновик хранится только в этом браузере. Скопируйте его, чтобы продолжить на другом устройстве.','Жоба тек осы браузерде сақталады. Басқа құрылғыда жалғастыру үшін көшіріңіз.')+'</p><textarea id="rsJson" class="lcode">'+esc(JSON.stringify(RS.d,null,1))+'</textarea><div class="lbtns"><button class="ghost" data-rs="copyJson">'+L('Копировать','Көшіру')+'</button><button class="ghost" data-rs="loadJson">'+L('Загрузить из поля','Өрістен жүктеу')+'</button><button class="ghost" data-rs="clear">'+L('Очистить черновик','Жобаны тазалау')+'</button></div>'+(RS.msg?'<p class="lmsg">'+esc(RS.msg)+'</p>':'')+'</section>';
  }
  app.innerHTML=RS_CSS+'<div class="cat-head" style="margin-top:16px"><h1>'+L('Научная работа и исследовательский проект','Ғылыми жұмыс және зерттеу жобасы')+'</h1><p>'+L('Сначала настоящее исследование, потом тексты. Генератор не пишет вымышленную работу по одному названию темы.','Алдымен нақты зерттеу, кейін мәтін. Генератор тақырып атауы бойынша ойдан жұмыс жазбайды.')+'</p></div>'+bar+
   (s.h&&s.h.length?'<div class="note" style="margin:0 0 12px">'+esc(L(s.h[0],s.h[1]))+'</div>':'')+body;
}
function rsOut(){
  const id=RS.task; let text, miss=[], tk=RS_TASKS.find(x=>x.id===id);
  if(id==='unified') text=rsUnified();
  else{miss=rsMissing(tk); text=rsPrompt(miss.length&&tk.fb?tk.fb:id)}
  const fbT=tk&&miss.length&&tk.fb?RS_TASKS.find(x=>x.id===tk.fb):null;
  const chSel=tk&&tk.ch?'<div class="f" style="margin-bottom:10px"><label for="rsCh">'+L('Какая глава','Қай тарау')+'</label><select id="rsCh" data-rs-ch="1">'+RS_CHAPTERS.map(c=>'<option'+(c===RS.chapter?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>':'';
  return '<section class="panel" style="margin-top:14px" id="rsOut"><div class="out-h"><h2>'+esc(id==='unified'?L('Единый промпт','Бірыңғай промпт'):L(tk.ru,tk.kk))+'</h2><button class="btn ok" data-rs="copy">'+t_copy()+'</button></div>'+chSel+
   (miss.length?'<div class="warn">'+L('Для этой задачи не хватает: ','Бұл тапсырмаға жетіспейді: ')+esc(miss.map(n=>Array.isArray(n)?n.map(RS_FIELD_NAME).join(' / '):RS_FIELD_NAME(n)).join('; '))+'. '+(fbT?L('Ниже — промпт для подготовки этих материалов: «','Төменде — осы материалды дайындау промпты: «')+esc(L(fbT.ru,fbT.kk))+'».':L('Заполните поля — пока в промпте стоят пометки «требует заполнения».','Өрістерді толтырыңыз — әзірге промптта «толтыруды қажет етеді» белгісі тұр.'))+'</div>':'')+
   '<div class="prompt"><pre id="rsPromptText">'+esc(text)+'</pre></div><div class="meta">'+text.length.toLocaleString('ru-RU')+' '+t('chars')+'</div>'+
   '<p class="lsub" style="margin-top:8px">'+L('Вставьте промпт в ChatGPT, Gemini или Claude; файлы (положение, текст работы, таблицы) прикрепите в тот же чат.','Промптты ChatGPT, Gemini не Claude-қа қойыңыз; файлдарды (ереже, жұмыс мәтіні, кесте) сол чатқа тіркеңіз.')+'</p></section>';
}
const t_copy=()=>t('copy');

/* ---- события ---- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-rs]'); if(!b||S.view!=='research') return;
  const a=b.dataset.rs;
  if(a==='step'){RS.step=Math.max(0,Math.min(RSF.length-1,+b.dataset.i));RS.msg='';renderResearch();window.scrollTo({top:0});return}
  if(a==='tog'){const k=b.dataset.rk,v=b.dataset.v;const arr=rarr(k).slice();const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);RS.d[k]=arr;rsSave();const y=window.scrollY;renderResearch();window.scrollTo({top:y});return}
  if(a==='task'){RS.task=b.dataset.id;const y=window.scrollY;renderResearch();window.scrollTo({top:y});const o=document.getElementById('rsOut');if(o)o.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(a==='copy'){copyText(document.getElementById('rsPromptText').textContent,b);return}
  if(a==='copyJson'){const el=document.getElementById('rsJson');copyText(el.value,b);return}
  if(a==='loadJson'){try{const v=JSON.parse(document.getElementById('rsJson').value);if(v&&typeof v==='object'){RS.d=v;rsSave();RS.msg=L('Черновик загружен.','Жоба жүктелді.')}}catch(err){RS.msg=L('Не удалось прочитать текст черновика.','Жоба мәтіні оқылмады.')}renderResearch();return}
  if(a==='clear'){if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent=L('Нажмите ещё раз — всё будет удалено','Тағы басыңыз — бәрі өшеді');return}RS.d={};RS.task=null;rsSave();RS.step=0;renderResearch();return}
});
app.addEventListener('input',e=>{
  if(S.view!=='research') return; const el=e.target, k=el.dataset&&el.dataset.rf; if(!k) return;
  RS.d[k]=el.type==='checkbox'?el.checked:el.value; rsSave();
  if(el.dataset.re){const y=window.scrollY;renderResearch();window.scrollTo({top:y});return}
  const pre=document.getElementById('rsPromptText'); if(pre&&RS.task){const tsk=RS_TASKS.find(x=>x.id===RS.task);pre.textContent=RS.task==='unified'?rsUnified():rsPrompt(rsMissing(tsk).length&&tsk.fb?tsk.fb:RS.task)}
});
app.addEventListener('change',e=>{
  if(S.view!=='research') return; const el=e.target;
  if(el.dataset&&el.dataset.rsCh){RS.chapter=el.value;const y=window.scrollY;renderResearch();window.scrollTo({top:y});return}
  if(el.dataset&&el.dataset.rf&&el.type==='checkbox'){RS.d[el.dataset.rf]=el.checked;rsSave();return}
  if(el.dataset&&el.dataset.rfile&&el.files[0]){const k=el.dataset.rfile;const r=new FileReader();r.onload=()=>{RS.d[k]=(RS.d[k]?RS.d[k]+'\n':'')+String(r.result);rsSave();const y=window.scrollY;renderResearch();window.scrollTo({top:y})};r.readAsText(el.files[0]);}
});

/* ---- навигация ---- */
(function(){
  const nav=document.querySelector('.nav');
  const nb=document.createElement('button'); nb.id='navResearch'; nav.insertBefore(nb,document.getElementById('navYoung'));
  nb.onclick=()=>go('research');
  const _setNav=setNav; setNav=function(w){_setNav(w);nb.classList.toggle('on',w==='research')};
  const _apply=applyChrome; applyChrome=function(){_apply();nb.textContent=L('Научный проект','Ғылыми жоба')};
  const _render=render; render=function(){if(S.view==='research'){applyChrome();renderResearch();return}_render()};
  const _home=renderHome; renderHome=function(){_home();const lb=app.querySelector('.libbanner');if(lb)lb.insertAdjacentHTML('afterend','<button class="libbanner" data-rs-go="1" style="background:var(--gold-soft);border-color:var(--gold)"><b style="color:var(--gold)">'+L('Научная работа и исследовательский проект','Ғылыми жұмыс және зерттеу жобасы')+'</b><span>'+L('Пошагово: анкета → положение конкурса → идея → данные → документы → проверка. Промпты для каждого этапа, без вымышленных результатов.','Қадаммен: сауалнама → байқау ережесі → идея → деректер → құжаттар → тексеру. Әр кезеңге промпт, ойдан нәтижесіз.')+'</span></button>')};
  app.addEventListener('click',e=>{if(e.target.closest('[data-rs-go]'))go('research')});
})();

/* Молодому учителю: формула промпта (PDF «Промпт формуласы») */
YOUNG.splice(YOUNG.length-1,0,{ru:['Формула промпта','Роль — Задача — Контекст — Формат. Роль: кто отвечает («Ты — учитель математики с 20-летним опытом»). Задача: что сделать («составь 10 тестовых вопросов»). Контекст: для кого и с какими ограничениями («6 класс, слабая группа, 15 минут»). Формат: в каком виде («таблица: вопрос | варианты | ответ»). Генераторы платформы собирают эти четыре части за вас.'],
 kk:['Промпт формуласы','Рөл — Тапсырма — Контекст — Формат. Рөл: кім жауап береді («Сен — 20 жылдық тәжірибесі бар математика мұғалімісің»). Тапсырма: не істеу керек («10 тест сұрағын құрастыр»). Контекст: кімге, қандай шектеумен («6-сынып, әлсіз топ, 15 минут»). Формат: қандай түрде («кесте: сұрақ | нұсқалар | жауап»). Платформа генераторлары осы төрт бөлікті сіз үшін жинайды.'],
 go:[['Тест',['Попробовать на тесте','Тестпен байқап көру']],['Сообщение родителям',['Сообщение родителям','Ата-аналарға хабарлама']]]});
/* Курстан ашу / открыть из курса: ?item=<генератор атауы> немесе ?view=lib|young|bonus|research */
let __deep=false;
try{
  const q=new URLSearchParams(location.search), it=q.get('item'), vw=q.get('view');
  if(it&&findItem(it)){openItem(it);__deep=true}
  else if(vw==='lib'&&typeof libGo==='function'){libGo('home');__deep=true}
  else if(vw&&['bonus','young','research'].includes(vw)){go(vw);__deep=true}
}catch(e){}
if(!__deep) render();
</script>
